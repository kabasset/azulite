<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Azulite</title>
    <link rel="icon" type="image/x-icon" href="img/azumy_favicon.png">
    <link rel="stylesheet" href="css/main.css">
    <!-- Mandatory when setting up Aladin Lite v3 for a smartphones/tablet usage -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
</head>

<body>

    <div class="layout">

        <div class="map-pane">
            <div id="aladin-lite-div" title="Click to select center, then radius." oncontextmenu="return false;">
                <p>We're rubbing the magic lamp...</p>
            </div>
        </div>

        <div class="control-pane">
            <section class="section">
                <details id="detailsFind" open>
                    <summary class="section-title">Select target</summary>
                    <div>
                        <label>Name or coordinates</label><input id="targetField" type="text" placeholder="UGC11116">
                    </div>
                    <div>
                        <label>Radius</label><input id="radiusField" type="text" placeholder="0.1">
                    </div>
                    <div>
                        <span>
                            <button id="goto-button">Go to target</button>
                        </span>
                    </div>
                </details>
            </section>
            <section class="section">
                <details id="hips2fits" open>
                    <summary class="section-title">Generate image</summary>
                    <div>
                        <span>
                            <button id="preview-button">Preview</button>
                        </span>
                        <span>
                            <button id="open-button">Open</button>
                        </span>
                    </div>
                    <summary class="section-title"></summary>
                    <div>
                        <img id="preview-img" src="" alt="Please select a region." />
                    </div>
                </details>
            </section>
        </div>
    </div>

    <script src='https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js'></script>
    <script type="text/javascript" src="js/main.js"></script>

</body>

</html>
